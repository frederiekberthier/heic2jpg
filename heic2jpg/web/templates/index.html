<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HEIC Converter</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand"><span class="brand-slash" aria-hidden="true">/</span>heic2jpg
      <span class="brand-sub">HEIC Converter</span></a>
    <span class="header-note">Draait lokaal: je foto's blijven op deze pc</span>
  </header>

  <main>
    <h1>HEIC Converter</h1>
    <p class="sub">Zet HEIC-foto's om naar JPG, JPEG of PNG. Alles gebeurt lokaal op deze pc.</p>

    <label id="drop" class="drop" tabindex="0">
      <input id="picker" type="file" accept=".heic,.heif,image/heic,image/heif" multiple hidden>
      <span class="drop-title">Sleep HEIC-bestanden hierheen</span>
      <span class="drop-or">of</span>
      <span class="btn primary">Kies bestanden</span>
    </label>

    <section class="settings" aria-label="Instellingen">
      <div class="field">
        <label for="format">Uitvoerformaat</label>
        <select id="format">
          <option value="jpg">JPG</option>
          <option value="jpeg">JPEG</option>
          <option value="png">PNG</option>
        </select>
      </div>
      <div class="field grow">
        <label for="quality"><span id="qlabel">Kwaliteit</span> <output id="qval">90</output></label>
        <input id="quality" type="range" min="1" max="100" value="90">
        <small id="qhint">Hoger = betere kwaliteit, groter bestand.</small>
      </div>
      <div class="field">
        <label for="maxsize">Max. afmeting (px)</label>
        <input id="maxsize" type="number" min="0" step="1" placeholder="origineel">
      </div>
      <div class="field check">
        <label><input id="exif" type="checkbox" checked> EXIF-metadata behouden</label>
      </div>
    </section>

    <section id="list-wrap" hidden>
      <div class="list-head">
        <h2>Bestanden</h2>
        <div class="actions">
          <button id="clear" class="btn">Lijst leegmaken</button>
          <button id="all" class="btn primary">Alles converteren naar map…</button>
        </div>
      </div>
      <ul id="list" class="list"></ul>
      <p id="support" class="note"></p>
    </section>
  </main>

  <footer class="site-footer">
    <strong>heic2jpg</strong> · HEIC naar JPG, JPEG of PNG
  </footer>

  <template id="row-tpl">
    <li class="row">
      <div class="thumb"><span>…</span></div>
      <div class="info">
        <div class="orig"></div>
        <label class="name-label">Opslaan als
          <input class="name" type="text" spellcheck="false">
        </label>
        <div class="status"></div>
      </div>
      <div class="row-actions">
        <button class="btn primary save">Converteren &amp; opslaan…</button>
        <button class="btn remove" title="Verwijderen" aria-label="Verwijderen">✕</button>
      </div>
    </li>
  </template>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
