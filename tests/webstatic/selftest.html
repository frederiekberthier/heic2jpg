<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><title>web-static selftest</title></head>
<body>
<pre id="out">bezig…</pre>
<script src="/web-static/converter-client.js"></script>
<script>
"use strict";
// Draait de echte worker + libheif op een testbestand en stuurt de resultaten naar /result.
const has = (bytes, s) => {
  const needle = Array.from(s, (c) => c.charCodeAt(0));
  outer: for (let i = 0; i <= bytes.length - needle.length; i++) {
    for (let j = 0; j < needle.length; j++) if (bytes[i + j] !== needle[j]) continue outer;
    return true;
  }
  return false;
};

async function inspect(blob) {
  const bytes = new Uint8Array(await blob.arrayBuffer());
  const bmp = await createImageBitmap(blob);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return {
    b64: btoa(bin),
    type: blob.type, size: blob.size, width: bmp.width, height: bmp.height,
    exif: has(bytes, "Exif\0\0") || has(bytes, "eXIf"),
    make: has(bytes, "TestCam"),
    icc: has(bytes, "ICC_PROFILE") || has(bytes, "iCCP"),
  };
}

async function main() {
  const r = {};
  const file = new File([await (await fetch("/sample.heic")).blob()], "sample.heic");
  for (const [k, o] of Object.entries({
    jpg: { fmt: "jpg", quality: 90 },
    jpeg: { fmt: "jpeg", quality: 90 },
    png: { fmt: "png" },
    jpg_q20: { fmt: "jpg", quality: 20 },
    jpg_q95: { fmt: "jpg", quality: 95 },
    noexif: { fmt: "jpg", keepExif: false },
    max100: { fmt: "png", maxSize: 100 },
  })) r[k] = await inspect(await HeicConverter.convert(file, o));
  r.preview = await inspect(await HeicConverter.preview(file));
  try {
    await HeicConverter.convert(new File([new Uint8Array([1, 2, 3])], "bad.heic"), { fmt: "jpg" });
    r.invalid = "geen fout";
  } catch (e) { r.invalid = e.message; }
  return r;
}

main().then((r) => r, (e) => ({ fatal: String(e && e.stack || e) })).then((r) => {
  document.getElementById("out").textContent = JSON.stringify(r, null, 2);
  return fetch("/result", { method: "POST", body: JSON.stringify(r) });
});
</script>
</body>
</html>
